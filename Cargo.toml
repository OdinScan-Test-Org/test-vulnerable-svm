[package]
name = "vulnerable-token-vault"
version = "0.1.0"
edition = "2021"
description = "Intentionally vulnerable Solana program for security testing"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "2.2"
borsh = { version = "1.5", features = ["derive"] }
spl-token = { version = "7.0", features = ["no-entrypoint"] }
thiserror = "2.0"

[profile.release]
opt-level = 3
# Intentionally missing: overflow-checks = true (Vuln #11)
# Intentionally missing: panic = 'abort' (Vuln #11)
